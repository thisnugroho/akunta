name: Build Docker Image

on:
  push:
    branches:
      - production

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish Accounting image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/accounting/Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/akunta-accounting:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/akunta-accounting:production
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=accounting
          cache-to: type=gha,mode=max,scope=accounting
