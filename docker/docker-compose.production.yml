name: akunta

services:
  accounting:
    image: ghcr.io/${GHCR_OWNER:-thisnugroho}/akunta-accounting:${IMAGE_TAG:-production}
    pull_policy: always
    ports:
      - "${HTTP_PORT:-80}:80"
    env_file:
      - ${APP_ENV_FILE:-../.env.production}
    environment:
      DB_CONNECTION: ecosystem_control
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-ecosystem_control}
      DB_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - backend

  queue:
    image: ghcr.io/${GHCR_OWNER:-thisnugroho}/akunta-accounting:${IMAGE_TAG:-production}
    pull_policy: always
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    user: www-data
    env_file:
      - ${APP_ENV_FILE:-../.env.production}
    environment:
      DB_CONNECTION: ecosystem_control
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-ecosystem_control}
      DB_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  scheduler:
    image: ghcr.io/${GHCR_OWNER:-thisnugroho}/akunta-accounting:${IMAGE_TAG:-production}
    pull_policy: always
    command: php artisan schedule:work
    user: www-data
    env_file:
      - ${APP_ENV_FILE:-../.env.production}
    environment:
      DB_CONNECTION: ecosystem_control
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-ecosystem_control}
      DB_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  migrate:
    image: ghcr.io/${GHCR_OWNER:-thisnugroho}/akunta-accounting:${IMAGE_TAG:-production}
    pull_policy: always
    command: php artisan migrate --force
    user: www-data
    env_file:
      - ${APP_ENV_FILE:-../.env.production}
    environment:
      DB_CONNECTION: ecosystem_control
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-ecosystem_control}
      DB_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    networks:
      - backend

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-ecosystem_control}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres-data:
  redis-data:
